services:
  db:
    image: postgres:16-alpine
    container_name: qms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qms_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-qms}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - qms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qms} -d ${POSTGRES_DB:-qms}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  qms_pgdata:
